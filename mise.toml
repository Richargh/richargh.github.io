[tools]
node = "v24.21.0"

[hooks]
postinstall = "npx playwright install chromium"

[tasks.check]
description = "Run linting and tests"
run = [
    "npm run lint",
    "npm test"
]

[tasks.generate]
description = "Generate the static Mastro site"
run = [
    "npm run generate",
    "npm run validate:generated",
]
