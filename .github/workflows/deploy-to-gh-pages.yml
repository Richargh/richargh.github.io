name: Deploy Mastro to GitHub Pages

on:
  push:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and test Mastro site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install mise-pinned toolchain
        uses: jdx/mise-action@v4.3.0
        with:
          install: true
          cache: true

      - name: Cache npm and Playwright downloads
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium and CI dependencies
        run: npx playwright install --with-deps chromium

      - name: Run checks
        run: mise run check

      - name: Generate static site
        run: mise run generate

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: generated

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/docs'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
