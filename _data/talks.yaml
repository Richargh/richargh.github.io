- id: rstbd
  title: Remote Scaled Trunk-Based Development
  thumbnail: /assets/img/thumbnails/rstbd-2022-11-09-NBjZ3wRXkxY.jpg
  tags:
    - trunk-based-development
    - remote-work
  abstract: >
      How to coordinate teams of 40+ developers and get consistent quality in a remote setting? Plenty scaling methods have been proposed but they leave out the technical practices needed to achieve quality at scale and big-bang migrate teams.

