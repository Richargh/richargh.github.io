- id: kvj
  title: Kotlin kontra Java
  codeUrl: https://github.com/Richargh/kotlin-kontra-java
  tags:
    - kotlin
    - java
  abstract: >
      Java has introduced many attractive language features in recent years - records, pattern matching and virtual threads - and thus a large part of what was previously exclusive to Kotlin. But has Java really covered everything attractive about Kotlin? Is Kotlin still relevant in 2026?

      To get to the bottom of these questions, we will analyze and evaluate the developments in the architecture of both languages and the exemplary use cases from a developer's perspective. We will also take a look into the future and compare the emerging development steps of both languages over the next few years.

      The talk aims to help current and future developers choose the right programming language for their needs by providing a complete, unbiased picture of the strengths and limitations of both languages.
