- id: rrr
  title: Refactor, Rearchitect, Rebuild - What to do when?
  tags:
    - architecture
    - legacy-code
    - modernisation
  abstract: >
      There are many ways to modernize software – but which strategy makes sense when? “Refactor, rearchitect, rebuild” and their relatives are buzzwords, but behind each approach are different prerequisites and goals. In this presentation, we will highlight how to recognize the right time for renewal and which methods can be used to accurately assess the current state of the system. Only on this basis can we assess which modernization strategy – from targeted refactoring to complete rebuild – best suits the individual system and future requirements.
